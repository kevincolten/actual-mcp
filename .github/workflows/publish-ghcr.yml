name: publish-ghcr

# Builds the container image and pushes it to GitHub Container Registry.
# Uses the built-in GITHUB_TOKEN, so no registry secrets need configuring.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/actual-mcp:latest
            ghcr.io/${{ github.repository_owner }}/actual-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
